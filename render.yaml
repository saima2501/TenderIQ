services:
  - type: web
    name: tenderiq-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.api.app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONPATH
        value: .
      - key: ENABLE_SEMANTIC_RETRIEVER
        value: "0"
      - key: ENABLE_NLI_MODEL
        value: "0"
